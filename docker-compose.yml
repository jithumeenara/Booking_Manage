version: '3.9'

# Modern Docker Compose with performance optimizations
x-common-variables: &common-variables
  TZ: Asia/Kolkata

services:
  # MySQL Database with optimizations
  db:
    image: mysql:8.0
    container_name: booking_db
    restart: unless-stopped
    environment:
      <<: *common-variables
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-acsti_db}
      MYSQL_USER: ${DB_USER:-booking_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-booking_password}
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=200
      - --innodb_buffer_pool_size=512M
      - --innodb_log_file_size=128M
      - --innodb_flush_log_at_trx_commit=2
      - --innodb_flush_method=O_DIRECT
      - --query_cache_type=1
      - --query_cache_size=32M
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db_init:/docker-entrypoint-initdb.d:ro
    networks:
      - booking_network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Redis Cache for sessions and caching
  redis:
    image: redis:7-alpine
    container_name: booking_redis
    restart: unless-stopped
    environment:
      <<: *common-variables
    command: >
      redis-server --appendonly yes --appendfsync everysec --maxmemory 256mb --maxmemory-policy allkeys-lru --save 900 1 --save 300 10 --save 60 10000
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - booking_network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Backend Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-server
      cache_from:
        - booking-app:latest
      args:
        BUILDKIT_INLINE_CACHE: 1
    image: booking-app:latest
    container_name: booking_app
    restart: unless-stopped
    environment:
      <<: *common-variables
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-acsti_db}
      DB_USER: ${DB_USER:-booking_user}
      DB_PASSWORD: ${DB_PASSWORD:-booking_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - booking_network
    volumes:
      - ./uploads:/app/uploads
      - app_logs:/app/logs
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # Nginx Reverse Proxy with Brotli
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-server
    image: booking-nginx:latest
    container_name: booking_nginx
    restart: unless-stopped
    environment:
      <<: *common-variables
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - booking_network
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
      - nginx_logs:/var/log/nginx
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # Development mode (optional)
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: booking_dev
    environment:
      <<: *common-variables
      NODE_ENV: development
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-acsti_db}
      DB_USER: ${DB_USER:-booking_user}
      DB_PASSWORD: ${DB_PASSWORD:-booking_password}
    ports:
      - "8080:8080"
      - "3001:3001"
    depends_on:
      - db
      - redis
    networks:
      - booking_network
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.vite
    profiles:
      - development

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  app_logs:
    driver: local
  nginx_cache:
    driver: local
  nginx_logs:
    driver: local

networks:
  booking_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
